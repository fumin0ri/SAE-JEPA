[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-jepa"
version = "0.1.0"
description = "Stage 1: dense reconstruction + SIGReg representations of LLM residuals before Top-K SAE"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.5,<3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sj-compute-normalization = "sae_jepa.normalization:main"
sj-fit-pca = "sae_jepa.normalization:pca_main"
sj-train-dense = "sae_jepa.train:main"
sj-evaluate-dense = "sae_jepa.evaluate:main"
sj-report-dense = "sae_jepa.reporting:main"
sj-make-synthetic = "sae_jepa.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
